[project]
name = "bpif-admin-backend"
version = "0.1.0"
description = "Backend API for bpif-admin"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
