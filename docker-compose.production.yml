# Production additions. Run with:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build

services:
  db:
    restart: unless-stopped

  backend:
    # Separate tags per environment, see docker-compose.override.yml.
    image: bpif-admin-backend:prod
    build:
      target: prod
    restart: unless-stopped

  frontend:
    image: bpif-admin-frontend:prod
    build:
      target: prod
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    restart: unless-stopped
