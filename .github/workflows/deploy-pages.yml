name: Deploy to GitHub Pages

on:
  # Deploys master once CI has passed on it.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # Rebuilds without a new commit, e.g. after updating the API_ORIGIN secret.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running deployment, which could leave Pages half updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run also fires for pull requests from a branch named master, and
    # workflow_dispatch can be started from any branch: only deploy master.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI passed on, which may no longer be the tip of master.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check the API_ORIGIN secret
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
        run: |
          if [[ ! "$API_ORIGIN" =~ ^https://[^/]+$ ]]; then
            echo '::error::The API_ORIGIN secret must be an origin like https://example.trycloudflare.com, with no path or trailing slash.'
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Fails here if Pages isn't enabled with "GitHub Actions" as its source.
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_API_ORIGIN: ${{ secrets.API_ORIGIN }}
        run: npm run build

      # Pages has no SPA fallback, but serves 404.html for unknown paths. Without
      # this, opening a link like /payments/<id> directly gives GitHub's 404 page.
      - name: Add the SPA fallback
        run: cp build/index.html build/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
